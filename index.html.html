<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>애니띵 - 서브컬처 동아리 커뮤니티</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">✨</span>
                <h1 class="text-xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">애니띵 (ANYTING)</h1>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openAdminModal()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-300 font-medium transition">관리자 모드</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
        
        <!-- Notice Banner -->
        <div class="bg-gradient-to-r from-purple-900/40 to-pink-900/40 border border-purple-500/30 rounded-2xl p-4 flex items-center justify-between">
            <div>
                <h2 class="font-bold text-purple-300 text-sm">📢 동아리 공지</h2>
                <p class="text-xs text-slate-300 mt-1">부정종속물 및 욕설·도배 글은 관리자에 의해 예고 없이 삭제될 수 있습니다.</p>
            </div>
        </div>

        <!-- Post Writing Section -->
        <section class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg">
            <h3 class="text-sm font-bold text-slate-200 mb-3">💬 이야기 나누기</h3>
            <form id="postForm" onsubmit="handlePostSubmit(event)" class="space-y-3">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input type="text" id="author" placeholder="닉네임 (예: 덕후1호)" required
                        class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-purple-500">
                    <select id="category" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-purple-500 text-slate-300">
                        <option value="자유">자유 토크</option>
                        <option value="애니추천">애니 추천</option>
                        <option value="행사후기">행사/코스프레 후기</option>
                        <option value="모임질문">모임 관련 문의</option>
                    </select>
                </div>
                <textarea id="content" rows="3" placeholder="자유롭게 덕질 이야기를 남겨주세요!" required
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-sm focus:outline-none focus:border-purple-500 resize-none"></textarea>
                <div class="flex justify-end">
                    <button type="submit" class="bg-purple-600 hover:bg-purple-500 text-white font-semibold px-6 py-2 rounded-xl text-sm transition shadow-md">
                        글 등록하기
                    </button>
                </div>
            </form>
        </section>

        <!-- Post List Section -->
        <section class="space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-slate-200 text-base">최신 게시글</h3>
                <span id="postCount" class="text-xs text-slate-400">0개의 글</span>
            </div>
            <div id="postsContainer" class="space-y-3">
                <!-- Posts will be dynamically inserted here -->
            </div>
        </section>
    </main>

    <!-- Admin Modal -->
    <div id="adminModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl">
            <h3 class="text-base font-bold text-slate-100">관리자 인증</h3>
            <p class="text-xs text-slate-400">게시글을 삭제하려면 관리자 비밀번호를 입력하세요.</p>
            <input type="password" id="adminPw" placeholder="비밀번호 입력" 
                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-purple-500">
            <div class="flex space-x-2 justify-end">
                <button onclick="closeAdminModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs font-medium transition">취소</button>
                <button onclick="verifyAdmin()" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 rounded-xl text-xs font-semibold transition">확인</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500 mt-auto">
        &copy; 2026 애니띵(ANYTING) Club. All rights reserved.
    </footer>

    <script>
        // 초기 게시글 데이터 (필요시 수정 가능)
        let posts = JSON.parse(localStorage.getItem('anyting_posts')) || [
            { id: 1, author: '관리자', category: '자유', content: '환영합니다! 애니띵 동아리 커뮤니티입니다. 즐거운 덕질 되세요 ✨', date: '2026-11-06 12:00' }
        ];

        let isAdmin = false;

        function saveAndRender() {
            localStorage.setItem('anyting_posts', JSON.stringify(posts));
            renderPosts();
        }

        function renderPosts() {
            const container = document.getElementById('postsContainer');
            const countEl = document.getElementById('postCount');
            countEl.innerText = `${posts.length}개의 글`;

            if (posts.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm bg-slate-800/50 rounded-2xl border border-slate-800">등록된 글이 없습니다. 첫 글을 남겨보세요!</div>`;
                return;
            }

            container.innerHTML = posts.map(post => `
                <div class="bg-slate-800 border border-slate-700/60 rounded-2xl p-4 shadow-sm space-y-2">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs bg-purple-900/60 text-purple-300 border border-purple-700/50 px-2.5 py-0.5 rounded-full font-medium">${post.category}</span>
                            <span class="font-semibold text-sm text-slate-200">${escapeHtml(post.author)}</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-xs text-slate-500">${post.date}</span>
                            ${isAdmin ? `<button onclick="deletePost(${post.id})" class="text-xs bg-rose-900/40 text-rose-400 border border-rose-700/50 px-2.5 py-1 rounded-lg hover:bg-rose-900 transition font-medium">삭제</button>` : ''}
                        </div>
                    </div>
                    <p class="text-sm text-slate-300 whitespace-pre-wrap pt-1">${escapeHtml(post.content)}</p>
                </div>
            `).join('');
        }

        function handlePostSubmit(e) {
            e.preventDefault();
            const author = document.getElementById('author').value.trim();
            const category = document.getElementById('category').value;
            const content = document.getElementById('content').value.trim();

            if (!author || !content) return;

            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            const newPost = {
                id: Date.now(),
                author,
                category,
                content,
                date: dateStr
            };

            posts.unshift(newPost);
            saveAndRender();

            document.getElementById('postForm').reset();
        }

        function deletePost(id) {
            if (confirm('정말 이 게시글을 삭제하시겠습니까?')) {
                posts = posts.filter(post => post.id !== id);
                saveAndRender();
            }
        }

        function openAdminModal() {
            if (isAdmin) {
                if (confirm('관리자 모드를 해제하시겠습니까?')) {
                    isAdmin = false;
                    renderPosts();
                    alert('관리자 모드가 해제되었습니다.');
                }
                return;
            }
            document.getElementById('adminModal').classList.remove('hidden');
            document.getElementById('adminModal').classList.add('flex');
            document.getElementById('adminPw').value = '';
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.remove('flex');
            document.getElementById('adminModal').classList.add('hidden');
        }

        function verifyAdmin() {
            const pw = document.getElementById('adminPw').value;
            // 🔐 관리자 비밀번호를 원하시는 문구로 변경하세요 (예: anyting1234)
            if (pw === 'anyting1234') {
                isAdmin = true;
                closeAdminModal();
                renderPosts();
                alert('관리자 인증이 완료되었습니다. 게시글에 삭제 버튼이 활성화됩니다.');
            } else {
                alert('비밀번호가 틀렸습니다.');
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // 초기 렌더링
        renderPosts();
    </script>
</body>
</html>
